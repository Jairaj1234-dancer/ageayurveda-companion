# Render Blueprint
services:
  - type: web
    name: ageayurveda-companion
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://ageayurveda.com,https://www.ageayurveda.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ageayurveda-db
          property: connectionString
    healthCheckPath: /api/v1/health

databases:
  - name: ageayurveda-db
    plan: starter
    region: singapore
    postgresMajorVersion: 16
