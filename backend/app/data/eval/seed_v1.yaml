# Companion v1 seed benchmark — hand-curated 30 questions across the
# Bṛhattrayī. Verse IDs are normalized as `source|section|verse_start` to
# match the metrics.py _norm_id helper. Expand to 100+ via vaidya curation
# per govt/research-synthesis.md §3.
#
# Conventions:
# - Use the exact diacritic source name as it appears in corpus_chunks
#   ("Aṣṭāṅga Hṛdaya", "Caraka Saṃhitā", "Suśruta Saṃhitā").
# - section is the sthāna name without "sthāna" optional but consistent.
# - verse_start is the verse number string (no "v.") to match what
#   ingest_sarit.py emits.
# - Questions are written colloquially; that's the point — we measure
#   whether the platform handles real user phrasing.

name: companion_v1_seed
items:

