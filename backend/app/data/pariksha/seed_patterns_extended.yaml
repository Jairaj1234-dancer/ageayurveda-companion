# Extended diagnostic patterns — batch 2 (rules 13-50+).
# Covers vyādhi added in seed_extended.yaml + seed_extended_2.yaml so the
# scoring engine can nominate candidates across the full seeded vyādhi set.
#
# Sources: pañca-nidāna chapters of Mādhava Nidāna 1-69, Caraka Cikitsā,
# Suśruta Cikitsā, Aṣṭāṅga Hṛdaya Cikitsā/Nidāna, AYUSH STG.
# All marked review_tier=llm-only; Vaidya validation pending.

diagnostic_patterns:

# ─── Vāta-vyādhi sub-types (5) ─────────────────────────────────────

  - name: "Ardita pattern (facial palsy)"
    description: "Unilateral facial droop + vāta-prakopa nāḍī ⇒ Ardita."
    pattern_type: "vyadhi"
    conditions:
      - {param: "Nāḍī", finding: "vāta-nāḍī", required: true}
      - {param: "Sparśa", finding: "śīta-rūkṣa-khara", required: false}
      - {param: "Vaya", finding: "vṛddha", required: false}
    targets:
      - {target_kind: "vyadhi", name: "Ardita", weight: 0.9,
         rationale: "Ardita is unilateral vāta lodging in facial muscles (Caraka Cikitsā 28)."}
    suggested_chikitsa: ["Mahāmāṣa Taila", "Aṇu Taila", "Bṛhat-vāta-cintāmaṇi Rasa"]
    red_flags:
      - "Bilateral palsy, associated stroke signs, or Lyme exposure — refer immediately"
    classical_source: "Caraka Cikitsā 28; Mādhava Nidāna 22"

  - name: "Kampavāta pattern (Parkinsonism)"
