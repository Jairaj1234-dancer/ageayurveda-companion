         rationale: "Vāta-prakopa in majjā with age — Caraka 28."}
    suggested_chikitsa: ["Mahāmāṣa Taila", "Bṛhat-vāta-cintāmaṇi Rasa", "Aśvagandhāriṣṭa", "Aśvagandhā"]
