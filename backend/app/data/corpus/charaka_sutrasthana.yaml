# Charaka Saṃhitā — Sūtrasthāna seed corpus.
#
# Same authoring conventions as Ashtanga Hridaya: Sanskrit (mūla pāṭha) is
# in the public domain (~2,000+ years old). The English column is an
# ORIGINAL CONCISE PARAPHRASE for retrieval grounding, not a reproduction
# of any copyrighted translation. Replace `english` and `summary` with
# properly-licensed translation content (Sharma & Dash, Priyavrat Sharma,
# or commissioned scholarly translation) before production deployment.
#
# Selection: foundational verses across the chapters most commonly cited
# in everyday Ayurvedic practice — definitions of health, the three pillars,
# Agni, the six tastes, daily/seasonal routine, and the famous threefold
# causation of disease. Charaka is the most-cited classical text in
# practitioner conversations; this slice gives the chatbot a defensible
# evidentiary base for the questions a wellness customer is most likely
# to ask.

source: "Charaka Samhita"
section: "Sutrasthana"
license: "Sanskrit: public domain. English: original paraphrase, internal use."

verses:

  # --- Chapter 1: Dirghanjivitiya (Pursuit of long life) ---

  - chapter: "Ch.1 Dirghanjivitiya"
    verse_start: "1.41"
    sanskrit: "समदोषः समाग्निश्च समधातुमलक्रियः। प्रसन्नात्मेन्द्रियमनाः स्वस्थ इत्यभिधीयते॥"
    transliteration: "samadōṣaḥ samāgniśca samadhātumalakriyaḥ | prasannātmēndriyamanāḥ svastha ityabhidhīyatē ||"
    english: "One whose doshas are in equilibrium, whose digestive fire is balanced, whose tissues and waste-elimination functions are in proper order, and whose Atman, senses, and mind are in a state of pleasant calm — such a person is called healthy (svastha)."
    summary: "The classical definition of health (svastha). Health is more than absence of disease — it requires balanced doshas, balanced agni, balanced dhatus and malas, and a serene mind. Foundational definition cited in nearly every Ayurvedic introduction."

  - chapter: "Ch.1 Dirghanjivitiya"
    verse_start: "1.57"
    sanskrit: "त्रय उपस्तम्भा इति आहार-स्वप्न-ब्रह्मचर्याणि।"
    transliteration: "traya upastambhā iti āhāra-svapna-brahmacaryāṇi |"
    english: "The three pillars (upastambhas) of life are food (ahara), sleep (svapna / nidra), and disciplined sexual conduct (brahmacharya)."
    summary: "Traya upastambha — the three sub-pillars supporting health. Food, sleep, and continence. When the chatbot is asked about general wellness foundations, this is the canonical citation."

  - chapter: "Ch.1 Dirghanjivitiya"
    verse_start: "1.58"
    sanskrit: "तैः त्रिभिः युक्तं युक्तियुक्तैरुपस्तब्धमुपस्तम्भैः शरीरं बलवर्णोपचयोपचितमनुवर्तते यावदायुष्यमप्रतिकूलवर्ज्यैर्न विकल्पते।"
    transliteration: "taiḥ tribhiḥ yuktaṃ yuktiyuktairupastabdhamupastambhaiḥ śarīraṃ balavarṇōpacayōpacitamanuvartatē yāvadāyuṣyamapratikūlavarjyairna vikalpatē |"
    english: "The body supported by these three pillars used wisely is endowed with strength, complexion and bulk for the full span of life — provided contraindicated practices are avoided."
    summary: "Application of the three pillars: when āhāra, nidrā, brahmacharya are practiced wisely, the body retains bala (strength), varṇa (complexion), and upacaya (proper bulk) for the full lifespan."

  # --- Chapter 5: Matrashitiya (Eating in proper measure) ---

  - chapter: "Ch.5 Matrashitiya"
    verse_start: "5.3"
    sanskrit: "मात्रावद् अशनं कुर्यात्। अग्नेस्तत् हि बलावहम्।"
    transliteration: "mātrāvad aśanaṃ kuryāt | agnēstat hi balāvaham |"
    english: "One should eat in proper measure (matra). Eating in proper measure is what gives strength to the digestive fire (Agni)."
    summary: "Eat in measure — overeating extinguishes Agni, undereating starves it. The practical rule: agni-strength dictates the right amount, not appetite alone."

  - chapter: "Ch.5 Matrashitiya"
    verse_start: "5.7"
    sanskrit: "तत्र सर्वग्रहणाद्वाऽयमिच्छानुग्रहार्थः।"
    transliteration: "tatra sarvagrahaṇādvā'yamicchānugrahārthaḥ |"
    english: "The right measure fills the stomach in a way that satisfies natural desire while leaving sufficient space — classically taught as one-third food, one-third liquid, one-third empty for digestive movement."
    summary: "Stomach-fullness rule (1/3 food, 1/3 liquid, 1/3 empty). One of the most quoted practical eating principles in Ayurveda."

  # --- Chapter 6: Tasyashitiya (Seasonal regimen) ---

  - chapter: "Ch.6 Tasyashitiya"
    verse_start: "6.3"
    sanskrit: "शीतो मारुतवान् रुक्षो हेमन्तः परिकीर्तितः।"
    transliteration: "śītō mārutavān rukṣō hēmantaḥ parikīrtitaḥ |"
    english: "Hemanta (early winter) is described as cold, windy and dry; Agni intensifies in this season as the body's heat is conserved internally."
    summary: "Hemanta (early winter) qualities — cold, windy, dry. Strong agni in winter; this is the season for nourishing, heavier foods (sweet, sour, salty) and oil massage."

  - chapter: "Ch.6 Tasyashitiya"
    verse_start: "6.22"
    sanskrit: "वर्षासु अग्निः प्रदुष्येत्। तस्मिन् काले लघु लघु आहारं प्राणयेत्।"
    transliteration: "varṣāsu agniḥ praduṣyēt | tasmin kālē laghu laghu āhāraṃ prāṇayēt |"
    english: "In varsha (monsoon), the digestive fire is weakened. In that season one should consume light, easily digestible food in small quantities."
    summary: "Monsoon weakens agni. Eat light, freshly cooked food in small portions during varsha. Boil all water. Avoid raw foods."

  - chapter: "Ch.6 Tasyashitiya"
    verse_start: "6.43"
    sanskrit: "स्वस्थस्य ऊर्जस्करं वृष्यं रसायनं दीर्घजीवनम्। ऋतुचर्यानुसारी हि पुरुषो नात्र संशयः॥"
    transliteration: "svasthasya ūrjaskaraṃ vṛṣyaṃ rasāyanaṃ dīrghajīvanam | ṛtucaryānusārī hi puruṣō nātra saṃśayaḥ ||"
    english: "Adherence to seasonal regimen (ritucharya) brings vigour, virility, rejuvenation and long life to the healthy person. There is no doubt in this."
    summary: "Why seasonal regimen matters — it's not optional, it's the difference between maintaining health and accumulating dosha across the year."

  # --- Chapter 7: Navegandharaniya (Suppression of natural urges) ---

  - chapter: "Ch.7 Navegandharaniya"
    verse_start: "7.3"
    sanskrit: "न वेगान् धारयेद् धीमान् जातान् मूत्रपुरीषयोः। न रेतसो न वातस्य न छर्द्याः क्षवथोर्न च॥"
    transliteration: "na vēgān dhārayēd dhīmān jātān mūtrapurīṣayōḥ | na rētasō na vātasya na charddyāḥ kṣavathōrna ca ||"
    english: "The wise should not suppress arisen natural urges — of urine, faeces, semen, flatus, vomiting, sneezing, and others (yawning, hunger, thirst, tears, sleep, exertion-induced breath)."
    summary: "Thirteen natural urges should not be suppressed (Ch. 7.3-4 lists thirteen). Suppression causes specific diseases — e.g. suppressing flatus causes Vata disorders, suppressing urine causes urinary disease."

  # --- Chapter 11: Tistraisaniya (Three desires of life) ---

  - chapter: "Ch.11 Tistraisaniya"
    verse_start: "11.3"
    sanskrit: "तिस्र एषणाः - प्राणैषणा, धनैषणा, परलोकैषणा।"
    transliteration: "tisra ēṣaṇāḥ - prāṇaiṣaṇā, dhanaiṣaṇā, paralōkaiṣaṇā |"
    english: "There are three desires (eshanas) of life: the desire for life itself (pranaishana), the desire for wealth (dhanaishana), and the desire for the world beyond (paralokaishana)."
    summary: "Three eshanas — the three legitimate aims of human striving in Ayurvedic philosophy. Health-seeking is grounded in the first."

  # --- Chapter 25: Yajjahpurushiya (Aetiology) ---

  - chapter: "Ch.25 Yajjahpurushiya"
    verse_start: "25.40"
    sanskrit: "हेतवश्च त्रयो रोगाणाम् असात्म्येन्द्रियार्थसंयोगः, प्रज्ञापराधः, परिणामश्चेति।"
    transliteration: "hētavaśca trayō rōgāṇām asātmyēndriyārthasaṃyōgaḥ, prajñāparādhaḥ, pariṇāmaścēti |"
    english: "There are three causes of disease: improper engagement of senses with their objects (asatmyendriyartha-samyoga), failure of intellect (prajnaparadha), and the action of time/seasons (parinama / kala)."
    summary: "Trividha hetu — Charaka's threefold classification of disease causation. Sensory misuse, errors of judgment, and time/seasonal effect. Foundational to Ayurvedic aetiology."

  # --- Chapter 27: Annapanavidhi (Diet) ---

  - chapter: "Ch.27 Annapanavidhi"
    verse_start: "27.3"
    sanskrit: "इष्टवर्णगन्धरसस्पर्शं विधिविहितमश्नतो ना उपयोगसंस्थानमाहारस्य आहारफलं विद्यात्।"
    transliteration: "iṣṭavarṇagandharasasparśaṃ vidhivihitamaśnatō nā upayōgasaṃsthānamāhārasya āhārafalaṃ vidyāt |"
    english: "Food taken according to proper rules — pleasant in colour, smell, taste and touch — gives the result of food (āhāra-phala): nourishment, strength and contentment."
    summary: "Food's full benefit (āhāra-phala) requires aesthetic and procedural correctness, not just nutritional content. The whole context of eating matters."

  # --- Chapter 30: Arthedasamahaniya (Ten great vessels) ---

  - chapter: "Ch.30 Arthedasamahaniya"
    verse_start: "30.26"
    sanskrit: "आयुर्वेदः इति - हिताहितं सुखं दुःखमायुस्तस्य हिताहितम्। मानं च तच्च यत्रोक्तमायुर्वेदः स उच्यते॥"
    transliteration: "āyurvēdaḥ iti - hitāhitaṃ sukhaṃ duḥkhamāyustasya hitāhitam | mānaṃ ca tacca yatrōktamāyurvēdaḥ sa ucyatē ||"
    english: "Ayurveda is the science that addresses what is wholesome and unwholesome to life, what is happy and unhappy, the measure of life, and the means of life — wherever this is taught, that is called Ayurveda."
    summary: "Charaka's classical definition of Ayurveda itself: the science of life (āyus), of what is hita (beneficial) and ahita (harmful), of sukha (happiness) and duḥkha (suffering)."

  # --- Chapter 28: Vividhashitapitiya (On various foods) ---

  - chapter: "Ch.28 Vividhashitapitiya"
    verse_start: "28.7"
    sanskrit: "अग्निरेव हि शरीरे आयुर्वर्णबलस्वास्थ्योत्साहोपचयप्रभाओजस्तेजोऽग्न्यनिलप्राणानां मूलं।"
    transliteration: "agnirēva hi śarīrē āyurvarṇabalasvāsthyōtsāhōpacayaprabhāōjastējō'gnyanilaprāṇānāṃ mūlaṃ |"
    english: "Agni alone, in the body, is the root of lifespan, complexion, strength, health, enthusiasm, bulk, lustre, ojas, tejas, fire-element, vital air and life-force."
    summary: "Why Agni is supreme. Twelve qualities flow from Agni: longevity, complexion, strength, health, enthusiasm, growth, lustre, ojas, tejas, agni itself, prana. Cited whenever the chatbot is asked about digestion as the foundation of health."
