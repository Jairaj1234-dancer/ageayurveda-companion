# Extended Vyādhi seed — batch 4 (vyādhi 105-155+).
# Covers classical sub-types not yet seeded:
#   - 7 dhātu-gata jvaras
#   - 4 more kāsa sub-types + 3 more śvāsa
#   - 7 mahā-kuṣṭha
#   - 7 udara-roga sub-types (vātodara/pittodara/kaphodara/sannipātodara/
#     plīhodara/baddhodara/chidrodara)
#   - More vāta-vyādhi (Avabāhuka, Khallī, Vepathu, Khaṇja, Pangu)
#   - More akṣi/karṇa-roga sub-types
#
# Sources: Caraka Cikitsā 3 (Jvara), 18 (Kāsa), 17 (Hikkā-Śvāsa),
# 7 (Kuṣṭha), 13 (Udara-roga), 28 (Vāta-vyādhi); Suśruta Cikitsā,
# Mādhava Nidāna 2-69; Aṣṭāṅga Hṛdaya Cikitsā/Nidāna.
# All marked review_tier=llm-only; Vaidya validation pending.

vyadhi:

