# Sources: Sushruta Uttara 2-26 (Śālākya), Aṣṭāṅga Hṛdaya Uttara 6-25,
# Mādhava Nidāna 33-69, Bhaiṣajya Ratnāvali, AYUSH STG.
# All marked review_tier=llm-only; Vaidya validation pending.

