# Extended Vyādhi seed — batch 2 (vyādhi 31-70).
# Focuses on classical sub-types and under-represented therapeutic categories:
#   - vāta-vyādhi specifics (Ardita, Kampavāta, Manyā-stambha, Kaṭi-śūla, …)
#   - jvara sub-types (viṣama, sannipāta, jīrṇa)
#   - atisāra sub-types
#   - kāsa/śvāsa sub-types
#   - kuṣṭha/skin-specific sub-types
#   - mūtra-roga sub-types
#   - stree-roga (raktapradara, śveta-pradara, kaṣṭa-ārtava, sūtikā-jvara)
#   - akṣi-roga (adhimantha, kāca, pillādi)
#   - mānasa-roga (unmāda, mada-mūrcchā)
#   - vraṇa / bhagandara / vidradhi / ślīpada / plīha-roga
#
# Sources: Mādhava Nidāna 1-69, Caraka Cikitsā 1-30, Suśruta Cikitsā,
# Aṣṭāṅga Hṛdaya Nidāna + Cikitsā, AYUSH Standard Treatment Guidelines.
# All marked review_tier=llm-only; Vaidya validation pending.

vyadhi:

