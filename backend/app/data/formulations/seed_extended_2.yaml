# Extended classical formulations — batch 3 (yogas 61-100).
# Adds new kalpana types: bhasma (calcined preparations), lepa (topical
# pastes), añjana (collyria), plus more rasāuṣadhi, taila, ghṛta, āsava.
#
# Sources: Bhaiṣajya Ratnāvali, Rasa-tarangiṇī, Rasa-yoga-sāgara,
# Sahasrayogam, Aṣṭāṅga Hṛdaya Uttara, Caraka Cikitsā, AFI Vol I-III,
# Sushruta Saṃhitā Sūtra/Cikitsā.
#
# All marked review_tier=llm-only; Vaidya validation pending.
# Bhasma/rasa preparations should ONLY be used from a properly-sourced
# manufacturer with a documented sodhana lineage; any "Hg-bearing" /
# "śuddha pārada" notation in this file is descriptive, not prescriptive.

name: classical_extended_40_batch2
formulations:

# ─── Curṇa (4) ──────────────────────────────────────────────────────

  - name_iast: "Yavakṣāra Curṇa"
    english: "Yavakshara digestive alkali powder"
    kalpana_type: "curṇa"
    primary_indication: "Vibandha, ānāha, gulma, mūtraghāta — alkali-driven anulomana"
    indications: ["vibandha", "ānāha", "gulma", "mūtraghāta", "udararoga"]
    dosha_action: {vata: "śāmaka", pitta: "vardhaka", kapha: "śāmaka"}
    karma: ["dīpana", "anulomana", "lekhana", "mūtrala"]
    dose_value: "500"
    dose_unit: "mg"
    anupana: ["uṣṇa-jala", "takra"]
    contraindications: ["amlapitta", "raktapitta", "peptic ulcer disease"]
    classical_source: "Sharangadhara Madhyama Khaṇḍa 6"
    notes: "Pure alkali — never on empty stomach without dilution."
    ingredients:
      - { ingredient_name: "Yavakṣāra", proportion: "principal", role: "kṣāra" }

  - name_iast: "Daśana-saṃskāra Curṇa"
    english: "Tooth-care powder"
    kalpana_type: "curṇa"
    primary_indication: "Dental hygiene, gingivitis, halitosis, mukha-pāka"
    indications: ["danta-roga", "danta-mūla-śosa", "mukha-pāka", "halitosis", "kṛmi-danta"]
    dosha_action: {vata: "sama", pitta: "śāmaka", kapha: "śāmaka"}
    karma: ["danta-balya", "mukha-vraṇa-ropaṇa", "kapha-śāmaka"]
    dose_value: "1-2"
    dose_unit: "g"
    anupana: ["applied directly to teeth/gums; rinse after"]
    classical_source: "Bhaiṣajya Ratnāvali Mukha-roga"
    ingredients:
      - { ingredient_name: "Khadira-sāra", proportion: "principal" }
      - { ingredient_name: "Triphalā", proportion: "supportive" }
      - { ingredient_name: "Trikaṭu", proportion: "supportive" }
      - { ingredient_name: "Marica", proportion: "supportive" }
      - { ingredient_name: "Karpūra", proportion: "supportive" }
      - { ingredient_name: "Lavaṅga", proportion: "supportive" }
      - { ingredient_name: "Maricā", proportion: "trace" }

  - name_iast: "Paṭolādi Curṇa"
    english: "Patola-led pitta-pacifying powder"
    kalpana_type: "curṇa"
    primary_indication: "Pitta-pradhāna jvara, rakta-doṣa, kuṣṭha"
    indications: ["pittaja jvara", "raktadoṣa", "kuṣṭha", "kāmalā"]
    dosha_action: {vata: "sama", pitta: "śāmaka", kapha: "śāmaka"}
