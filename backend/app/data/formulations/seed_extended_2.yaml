      - { ingredient_name: "Paṭola", proportion: "1 part", role: "pradhāna" }
      - { ingredient_name: "Kaṭukī", proportion: "1 part" }
      - { ingredient_name: "Nimba", proportion: "1 part" }
      - { ingredient_name: "Vāsā", proportion: "1 part" }
      - { ingredient_name: "Triphalā", proportion: "1 part" }

  - name_iast: "Pippalī-vardhamāna Rasāyana"
    english: "Graduated-pippali rasayana protocol"
    kalpana_type: "curṇa"
    primary_indication: "Kāsa, śvāsa, plīhā-roga, kṣaya — graduated-dose protocol"
    indications: ["kāsa", "śvāsa", "kṣaya", "plīhā-vṛddhi", "agnimāndya (chronic)"]
