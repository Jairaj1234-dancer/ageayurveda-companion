# Extended classical formulations — batch 4 (yogas 102-135).
# Focuses on under-represented therapeutic areas:
#   - single-dravya cūrṇas (foundational dispensary)
#   - stree-roga (women's health)
#   - bāla-roga (pediatric)
#   - netra-roga (eye care)
#   - mukha-roga (oral care)
#   - classical mahākaṣāya kvāthas
#
# Sources: Caraka Saṃhitā (Sūtra/Cikitsā), Suśruta Saṃhitā (Sūtra/Uttara),
# Aṣṭāṅga Hṛdaya (Sūtra/Uttara), Bhaiṣajya Ratnāvali (Bāla/Strī/Netra-roga),
# Sahasrayogam (Kerala), AFI Vol I-III.
# All marked review_tier=llm-only; Vaidya validation pending.

name: classical_extended_30_batch3
formulations:

# ─── Single-dravya cūrṇas (8) ──────────────────────────────────────

  - name_iast: "Aśvagandhā Cūrṇa"
    english: "Ashwagandha powder (single-dravya)"
    kalpana_type: "curṇa"
    primary_indication: "Daurbalya, anidrā, kṣīṇa-śukra, post-illness recovery"
    indications: ["daurbalya", "anidrā", "kṛśatā", "vāta-vyādhi", "stress", "fertility support"]
    dosha_action: {vata: "śāmaka", pitta: "sama", kapha: "vardhaka (if excess)"}
    karma: ["balya", "rasāyana", "vājīkaraṇa", "medhya"]
    dose_value: "3-6"
    dose_unit: "g"
    anupana: ["go-kṣīra", "uṣṇa-jala", "ghee + honey"]
    kala: "prātaḥ + sāyam"
    contraindications: ["sthaulya (relative)", "ati-kapha", "hyperthyroid (use cautiously)"]
