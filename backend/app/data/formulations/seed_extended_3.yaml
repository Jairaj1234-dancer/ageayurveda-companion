      - { ingredient_name: "Pippalī", proportion: "1 part" }
      - { ingredient_name: "Mustā", proportion: "1 part" }
      - { ingredient_name: "Ativiṣā", proportion: "1 part" }
      - { ingredient_name: "Kara¯ñja-bīja", proportion: "1 part" }

  - name_iast: "Suvarṇa-prāśana"
    english: "Gold-honey infant immunization protocol"
    kalpana_type: "leha"
    primary_indication: "Infant rasāyana, immunity-building, brain development — administered traditionally on Puṣya nakṣatra"
    indications: ["bāla-rasāyana", "infant immunity", "buddhi-vardhana", "speech development support"]
    dosha_action: {vata: "śāmaka", pitta: "sama", kapha: "śāmaka"}
    karma: ["rasāyana", "medhya", "balya"]
    dose_value: "1-2 drops (single drop dispenses ~62.5 µg svarṇa-bhasma)"
    dose_unit: "drops"
    anupana: ["administered as drop directly"]
    contraindications: ["any acute febrile illness"]
    classical_source: "Kāśyapa Saṃhitā Sūtra 18 (Lehādhyāya)"
    notes: "Sourcing critical — only certified pharmaceutical-grade swarṇa-bhasma is acceptable."
    ingredients:
      - { ingredient_name: "Svarṇa-bhasma", proportion: "principal (trace)" }
      - { ingredient_name: "Ghṛta", proportion: "vehicle" }
      - { ingredient_name: "Madhu", proportion: "vehicle" }
      - { ingredient_name: "Vacā", proportion: "supportive" }
      - { ingredient_name: "Brāhmī", proportion: "supportive" }
      - { ingredient_name: "Śaṅkhapuṣpī", proportion: "supportive" }

  - name_iast: "Kumāra-kalyāṇa Rasa"
