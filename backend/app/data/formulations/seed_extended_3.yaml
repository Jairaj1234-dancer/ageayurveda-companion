      - { ingredient_name: "Svarṇa-bhasma", proportion: "1 part" }
      - { ingredient_name: "Mauktika-bhasma", proportion: "1 part" }
      - { ingredient_name: "Aśvagandhā", proportion: "supportive" }
      - { ingredient_name: "Brāhmī", proportion: "supportive" }
      - { ingredient_name: "Vacā", proportion: "supportive" }

  - name_iast: "Madhu-Yaṣṭi Avaleha"
