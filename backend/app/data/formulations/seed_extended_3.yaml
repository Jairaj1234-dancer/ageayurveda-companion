    indications: ["pediatric jvara", "pediatric atisāra", "kāsa (bāla)", "agnimāndya (bāla)"]
    dosha_action: {vata: "śāmaka", pitta: "śāmaka", kapha: "śāmaka"}
    karma: ["jvara-ghna", "kāsa-hara", "dīpana"]
    dose_value: "125-500"
    dose_unit: "mg"
    anupana: ["madhu", "Pippalī kvātha"]
    classical_source: "Sahasrayogam Bāla-cikitsā; Aṣṭāṅga Hṛdaya Uttara 1"
