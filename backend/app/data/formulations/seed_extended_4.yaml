# Extended classical formulations — batch 5 (yogas 138-180+).
# Specialty focus:
#   - rasāyana (anti-aging) — Caraka Rasāyana-pāda variants
#   - mānasa-roga (mental health)
#   - hṛd-roga (cardiac)
#   - yakṛd-roga (hepatic)
#   - mūtra-roga (urinary)
#   - vājīkaraṇa (reproductive)
#
# Sources: Caraka Cikitsā 1.1-4 (Rasāyana + Vājīkaraṇa pāda),
# Mādhava Nidāna, Bhaiṣajya Ratnāvali, Sahasrayogam, Yogaratnākara,
# Rasa-yoga-sāgara, AFI Vol I-III.

name: classical_extended_40_batch4
formulations:

# ─── Classical rasāyana (8) ────────────────────────────────────────

  - name_iast: "Āmalakī Rasāyana"
    english: "Amalaki rasayana protocol"
    kalpana_type: "curṇa"
    primary_indication: "Universal rasāyana — pitta-dominant constitutions, jara-prati-bandhaka"
    indications: ["jarā", "kṣaya", "pitta-prakṛti rasāyana", "amlapitta", "rasāyana for elderly"]
    dosha_action: {vata: "śāmaka", pitta: "śāmaka", kapha: "sama"}
    karma: ["rasāyana", "cakṣuṣya", "raktavardhaka"]
    dose_value: "3-6"
    dose_unit: "g"
    anupana: ["go-kṣīra (warm)", "ghṛta + madhu"]
    classical_source: "Caraka Cikitsā 1.1.41-57"
    ingredients:
      - { ingredient_name: "Āmalakī (svarasa or fresh)", proportion: "principal" }
      - { ingredient_name: "Madhu", proportion: "vehicle" }
      - { ingredient_name: "Ghṛta", proportion: "vehicle" }

  - name_iast: "Triphalā Rasāyana"
    english: "Triphala rasayana protocol"
    kalpana_type: "curṇa"
    primary_indication: "Caraka's premier rasāyana — universal, mild, daily-use"
    indications: ["rasāyana (universal)", "jarā", "akṣiroga", "kuṣṭha (mild)", "agnimāndya"]
    dosha_action: {vata: "śāmaka (mild)", pitta: "śāmaka", kapha: "śāmaka"}
    karma: ["rasāyana", "cakṣuṣya", "anulomana", "tridoṣa-śāmaka"]
    dose_value: "3-6"
    dose_unit: "g"
    anupana: ["madhu + ghṛta (different ratios per ṛtu — Caraka)"]
    duration: "Year-round; ratios change by season per Caraka"
    classical_source: "Caraka Cikitsā 1.3 (Triphalā Rasāyana, Āyurveda-samutthānīya)"
    ingredients:
      - { ingredient_name: "Harītakī", proportion: "1 part" }
      - { ingredient_name: "Vibhītakī", proportion: "2 parts" }
      - { ingredient_name: "Āmalakī", proportion: "4 parts" }
      - { ingredient_name: "Madhu", proportion: "vehicle" }
      - { ingredient_name: "Ghṛta", proportion: "vehicle" }

  - name_iast: "Drākṣā Rasāyana"
    english: "Draksha rasayana"
    kalpana_type: "curṇa"
    primary_indication: "Pitta-pradhāna rasāyana, hṛdaya-rasāyana, mild post-illness recovery"
    indications: ["pitta-prakṛti rasāyana", "hṛd-daurbalya", "kṣaya", "amlapitta-prone"]
    dosha_action: {vata: "śāmaka", pitta: "śāmaka", kapha: "sama"}
    karma: ["balya", "rasāyana", "hṛdaya-balya"]
    dose_value: "5-10"
    dose_unit: "g (raisins)"
    anupana: ["go-kṣīra"]
    classical_source: "Caraka Cikitsā 1.4"
    ingredients:
      - { ingredient_name: "Drākṣā (raisins)", proportion: "principal" }
      - { ingredient_name: "Madhu", proportion: "supportive" }

  - name_iast: "Nāgabalādi Cūrṇa"
    english: "Nagabala-led rasayana powder"
    kalpana_type: "curṇa"
    primary_indication: "Asthi-kṣaya, post-fracture rehab, geriatric rasāyana"
    indications: ["asthi-kṣaya", "post-fracture rehab", "elderly debility"]
    dosha_action: {vata: "śāmaka", pitta: "sama", kapha: "vardhaka (mild)"}
    karma: ["balya", "asthi-poṣaka", "rasāyana"]
    dose_value: "3-6"
    dose_unit: "g"
    anupana: ["go-kṣīra"]
    classical_source: "Caraka Cikitsā 1.4"
    ingredients:
      - { ingredient_name: "Nāgabalā", proportion: "principal" }
      - { ingredient_name: "Aśvagandhā", proportion: "supportive" }
      - { ingredient_name: "Bala", proportion: "supportive" }
      - { ingredient_name: "Yaṣṭimadhu", proportion: "supportive" }

  - name_iast: "Indra Rasāyana"
    english: "Indra rasayana"
    kalpana_type: "avaleha"
    primary_indication: "Comprehensive rasāyana — geriatric debility, mental fatigue, sexual debility"
    indications: ["jarā", "rasāyana for geriatrics", "smṛti-kṣaya", "kṣīṇa-śukra"]
    dosha_action: {vata: "śāmaka", pitta: "sama", kapha: "vardhaka (if excess)"}
    karma: ["rasāyana", "vājīkaraṇa", "medhya"]
    dose_value: "10-20"
    dose_unit: "g"
    anupana: ["go-kṣīra"]
    classical_source: "Caraka Cikitsā 1.1.62-74"
    ingredients:
      - { ingredient_name: "Triphalā", proportion: "principal" }
      - { ingredient_name: "Pippalī", proportion: "principal" }
      - { ingredient_name: "Yaṣṭimadhu", proportion: "supportive" }
      - { ingredient_name: "Vidārī", proportion: "supportive" }
      - { ingredient_name: "Aśvagandhā", proportion: "supportive" }
      - { ingredient_name: "Sitā", proportion: "vehicle" }
      - { ingredient_name: "Madhu", proportion: "vehicle" }
      - { ingredient_name: "Ghṛta", proportion: "vehicle" }

  - name_iast: "Sukumāra Ghṛta"
    english: "Sukumara medicated ghee"
    kalpana_type: "ghṛta"
    primary_indication: "Vāta-pradhāna constipation, gentle sneha for delicate constitutions, stree-roga"
    indications: ["vibandha (chronic)", "ārśas", "gulma", "amenorrhea", "snehapāna for delicate patients"]
    dosha_action: {vata: "śāmaka", pitta: "śāmaka", kapha: "sama"}
    karma: ["snehana", "anulomana", "balya"]
    dose_value: "10-20"
    dose_unit: "g"
    anupana: ["uṣṇa-jala"]
    classical_source: "Sahasrayogam"
    ingredients:
      - { ingredient_name: "Eraṇḍa-mūla", proportion: "decoction" }
      - { ingredient_name: "Punarnavā", proportion: "decoction" }
      - { ingredient_name: "Daśamūla", proportion: "decoction" }
      - { ingredient_name: "Yaṣṭimadhu", proportion: "kalka" }
      - { ingredient_name: "Pippalī", proportion: "kalka" }
      - { ingredient_name: "Ghṛta", proportion: "1 part", role: "sneha" }

  - name_iast: "Pippalī Vardhamāna Rasāyana (single)"
    english: "Pippali single-graduated rasayana"
    kalpana_type: "curṇa"
    primary_indication: "Pulmonary rasāyana protocol — kāsa, śvāsa, kṣaya"
    indications: ["kāsa", "śvāsa", "kṣaya", "rasāyana"]
    dosha_action: {vata: "śāmaka", pitta: "vardhaka", kapha: "śāmaka"}
    karma: ["yogavāhi", "rasāyana"]
    dose_value: "1 piece day-1, increase 1 daily for 10 days, then decrease"
    dose_unit: "fresh pippalī fruits"
    duration: "20-day vardhamāna kalpa"
    contraindications: ["amlapitta", "raktapitta", "pregnancy"]
    classical_source: "Caraka Cikitsā 1.3"
    notes: "Distinct from compound Pippalī-vardhamāna — uses fresh pippalī alone."
    ingredients:
      - { ingredient_name: "Pippalī (fresh)", proportion: "principal" }
      - { ingredient_name: "Go-kṣīra", proportion: "vehicle" }

  - name_iast: "Mahā-Medā-Yoga"
    english: "Maha-meda compound"
    kalpana_type: "curṇa"
    primary_indication: "Kṣaya-jvara, rāja-yakṣmā, debility — rasāyana for advanced disease"
    indications: ["rāja-yakṣmā", "kṣaya", "jvara-jīrṇa", "post-illness rasāyana"]
    dosha_action: {vata: "śāmaka", pitta: "sama", kapha: "vardhaka (if excess)"}
    karma: ["balya", "rasāyana"]
    dose_value: "5-10"
    dose_unit: "g"
    anupana: ["go-kṣīra"]
    classical_source: "Caraka Cikitsā 8 (Yakṣma)"
    ingredients:
      - { ingredient_name: "Medā", proportion: "principal (aṣṭavarga)" }
      - { ingredient_name: "Mahā-medā", proportion: "principal" }
      - { ingredient_name: "Kākoli", proportion: "supportive" }
      - { ingredient_name: "Kṣīra-kākoli", proportion: "supportive" }
      - { ingredient_name: "Jīvaka", proportion: "supportive" }
      - { ingredient_name: "Ṛṣabhaka", proportion: "supportive" }
      - { ingredient_name: "Riddhi", proportion: "supportive" }
      - { ingredient_name: "Vṛddhi", proportion: "supportive" }

# ─── Mānasa-roga (mental health) (4) ──────────────────────────────

