    anupana: ["madhu", "Brāhmī ghṛta"]
    contraindications: ["pregnancy"]
    classical_source: "Bhaiṣajya Ratnāvali"
    ingredients:
      - { ingredient_name: "Pārada (śuddha)", proportion: "1 part" }
      - { ingredient_name: "Gandhaka (śuddha)", proportion: "1 part" }
      - { ingredient_name: "Brāhmī", proportion: "1 part" }
      - { ingredient_name: "Vacā", proportion: "1 part" }
      - { ingredient_name: "Śaṅkhapuṣpī", proportion: "1 part" }
      - { ingredient_name: "Jaṭāmāṃsī", proportion: "1 part" }

  - name_iast: "Unmāda-gajakeśarī Rasa"
