# ─── Caryā / regimen (4) ─────────────────────────────────────────

  - name_iast: "Dinacaryā"
    english: "Daily routine"
    hindi: "दिनचर्या"
    category: "caryā"
    subcategory: "dina"
    practitioner_level: "self-care"
    primary_indication: "Universal preventive — health maintenance, jarā-prati-bandhaka."
    pradhana_karma:
      - {step: "Brāhma-muhūrta utthāna (~96 min before sunrise)"}
      - {step: "Achamana, śauca (elimination), danta-dhāvana, jihvā-nirlekhana"}
      - {step: "Mukha-prakṣālana, akṣi-tarpaṇa, nasya"}
      - {step: "Abhyaṅga + udvartana + snāna"}
      - {step: "Vyāyāma (~half-strength)"}
      - {step: "Bhojana — twice daily, hot, sneha-yukta, six rasa, in due measure"}
      - {step: "Sandhyā-upāsanā, sleep at sat-saṃyamanena kāla"}
    duration_notes: "Daily, lifelong."
    frequency: "daily"
    classical_source: "Caraka Sūtra 5; Aṣṭāṅga Hṛdaya Sūtra 2; Suśruta Cikitsā 24"
    description: "Foundational hygiene + activity + diet sequencing protocol."

  - name_iast: "Ṛtucaryā"
    english: "Seasonal regimen"
    hindi: "ऋतुचर्या"
    category: "caryā"
