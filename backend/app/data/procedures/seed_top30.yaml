    dosha_action: {vata: "śāmaka", pitta: "śāmaka", kapha: "vardhaka (if excess)"}
    pradhana_karma:
      - {step: "12-24 g Cyavanaprāśa with warm milk on empty stomach, morning"}
      - {step: "Wait 1-2 hr before food"}
    duration_notes: "1-3 months per course; commonly hemanta-śiśira."
    contraindications: ["uncontrolled DM (high sugar content)", "ajīrṇa", "ati-kapha"]
    season: ["hemanta", "śiśira"]
    common_oils: []
