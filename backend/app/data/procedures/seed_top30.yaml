  - name_iast: "Patra-piṇḍa Sveda"
    english: "Herbal-leaf bolus svedana"
    hindi: "पत्र पिंड स्वेद"
    synonyms: ["Ela-kizhi"]
    category: "kriyā-bāhya"
    subcategory: "piṇḍa"
    practitioner_level: "supervised"
    primary_indication: "Sandhivāta, āmavāta, frozen shoulder, sports injuries — anti-inflammatory svedana."
    indications: ["āmavāta", "sandhivāta", "amasaspamukta vāta-vyādhi", "muscular spasm"]
    pradhana_karma:
      - {step: "Boluses of nirguṇḍī, eraṇḍa, citrus, cooked in oil; warm-applied in strokes"}
    duration_notes: "30-45 min; 7-14 days."
    classical_source: "Sahasrayogam"

  - name_iast: "Udvartana"
    english: "Therapeutic powder massage"
    hindi: "उद्वर्तन"
    category: "kriyā-bāhya"
    practitioner_level: "self-care"
    primary_indication: "Sthaulya (obesity), kaphaja medo-vṛddhi, prameha-pūrvarūpa, skin tone."
    indications: ["sthaulya", "kaphaja prameha", "kaṇḍū", "skin oiliness", "lymphedema (modern)"]
