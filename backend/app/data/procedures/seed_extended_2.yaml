# Extended procedures — batch 3 (procedures 50-75+).
# More specialty procedures: rasāyana protocols, vājīkaraṇa, more
# kṣārakarma applications, ophthalmic, dental, pediatric, geriatric.
#
# Sources: Suśruta Cikitsā 1-37, Aṣṭāṅga Hṛdaya Cikitsā 1-22 + Uttara,
# Caraka Cikitsā 1.1-4 (Rasāyana + Vājīkaraṇa pāda),
# Sahasrayogam regional procedures.

procedures:

# ─── More pañcakarma (3) ────────────────────────────────────────

  - name_iast: "Sarvāṅga Vamana"
    english: "Generalized therapeutic emesis"
    hindi: "सर्वांग वमन"
    category: "panchakarma"
    practitioner_level: "vaidya-only"
    primary_indication: "Generalized kapha-pradhāna disorders requiring deeper purification than localized basti"
    indications: ["sthaulya advanced", "tamaka śvāsa chronic", "psoriasis active"]
    dosha_action: {vata: "vardhaka", pitta: "sama", kapha: "śāmaka"}
    contraindications: ["pregnancy", "elderly", "raktapitta", "uncontrolled DM"]
    purva_karma:
      - {step: "Snehapāna 5-7 days"}
      - {step: "Sarvāṅga abhyaṅga + svedana"}
    pradhana_karma:
      - {step: "Vamanopaga drink with samya-yoga monitoring"}
    paschat_karma:
      - {step: "Saṃsarjana-krama 7 days"}
    duration_notes: "10-14 day cycle"
    classical_source: "Caraka Sūtra 15"

  - name_iast: "Mātrā-Virecana"
    english: "Small-dose maintenance purgation"
    hindi: "मात्रा विरेचन"
    category: "panchakarma"
    subcategory: "mātrā"
    practitioner_level: "supervised"
    primary_indication: "Daily wellness virecana for chronic pitta-kapha conditions"
    indications: ["chronic amlapitta", "chronic constipation", "obesity maintenance"]
    pradhana_karma:
      - {step: "Mild dose (Triphalā or trivṛt) at bedtime"}
    duration_notes: "Periodic — once weekly to monthly"
    classical_source: "Caraka Siddhi 4"

  - name_iast: "Tīkṣṇa Nasya"
    english: "Strong-action nasal medication"
    hindi: "तीक्ष्ण नस्य"
    category: "panchakarma"
    subcategory: "rēcanaka"
    practitioner_level: "vaidya-only"
    primary_indication: "Severe ūrdhva-jatru kapha-pradhāna disorders"
    indications: ["chronic pīnasa", "śiroroga (kapha-pradhāna)", "ardita rehab"]
    pradhana_karma:
      - {step: "Tīkṣṇa medicated material (śveta-marica, vacā)"}
      - {step: "Stronger than gentle Aṇu Taila — more cleansing"}
    contraindications: ["pediatric", "elderly", "raktapitta"]
    duration_notes: "5-7 days; gentle nasya thereafter"
    classical_source: "Caraka Siddhi 9"

# ─── Vājīkaraṇa specifics (3) ──────────────────────────────────

  - name_iast: "Asthi-rasāyana"
    english: "Bone-tissue rasayana protocol"
    hindi: "अस्थि रसायन"
    category: "rasāyana"
    subcategory: "dravya"
    practitioner_level: "vaidya-only"
    primary_indication: "Asthi-kṣaya, post-fracture rehab, osteoporosis support"
    indications: ["post-fracture rehab", "osteoporosis", "asthi-kṣaya"]
    pradhana_karma:
      - {step: "Lākṣādi Guggulu + Pravāla / Mukta-piṣṭi for asthi support"}
      - {step: "Daily milk + Aśvagandhā + Nāgabalā cūrṇa"}
    duration_notes: "1-3 months; longer for established osteoporosis"
    common_formulations: ["Lākṣādi Guggulu", "Pravāla-pañcāmṛta Rasa", "Nāgabalādi Cūrṇa"]
    classical_source: "Caraka Cikitsā 1.4; Aṣṭāṅga Hṛdaya Cikitsā 21"

  - name_iast: "Kuṭīpraveśika Vājīkaraṇa"
    english: "Residential vajikarana protocol"
    hindi: "कुटीप्रवेशिक वाजीकरण"
    category: "vājīkaraṇa"
    practitioner_level: "vaidya-only"
    primary_indication: "Comprehensive 30-90 day residential reproductive rejuvenation"
    indications: ["severe kṣīṇa-śukra", "vandhyatva (intractable)", "post-illness vājīkaraṇa"]
    purva_karma:
      - {step: "Pañcakarma śodhana"}
      - {step: "Residential setup with controlled diet/activity"}
    pradhana_karma:
      - {step: "Daily vājīkaraṇa dravya (Aśvagandhā Pāka, Mūsalī Pāka)"}
      - {step: "Strict regimen: brahmacarya, sun avoidance, mantra-japa"}
    duration_notes: "30-90 days residential"
    classical_source: "Caraka Cikitsā 2.1-4"

  - name_iast: "Vṛddha-Vājīkaraṇa"
    english: "Geriatric vajikarana modified protocol"
    hindi: "वृद्ध वाजीकरण"
    category: "vājīkaraṇa"
    practitioner_level: "supervised"
    primary_indication: "Age-appropriate vājīkaraṇa for elderly without intensive śodhana"
    indications: ["geriatric ojas-kṣaya", "elderly vājīkaraṇa"]
    pradhana_karma:
      - {step: "Mild rasāyana (Cyavanaprāśa, Drākṣāriṣṭa)"}
      - {step: "Avoid intensive śodhana; gentle abhyaṅga"}
    duration_notes: "1-3 months; can be continuous"
    classical_source: "Caraka Cikitsā 1.1"

