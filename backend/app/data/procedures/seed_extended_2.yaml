# ─── Dental procedures (2) ─────────────────────────────────────

  - name_iast: "Danta-Dhāvana"
    english: "Therapeutic tooth-brushing"
    hindi: "दन्तधावन"
    category: "caryā"
    subcategory: "dina"
    practitioner_level: "self-care"
    primary_indication: "Daily oral hygiene"
    indications: ["daily dental hygiene", "halitosis", "danta-roga prevention"]
    pradhana_karma:
      - {step: "Use bitter-astringent twig (Khadira, Karaṇja, Nimba) chewed end"}
      - {step: "Or modern equivalent: Daśana-saṃskāra Curṇa with brush"}
      - {step: "Gentle rubbing 2-3 min"}
    classical_source: "Caraka Sūtra 5; Aṣṭāṅga Hṛdaya Sūtra 2"

  - name_iast: "Jihvā-Nirlekhana"
    english: "Tongue scraping"
    hindi: "जिह्वा निर्लेखन"
    category: "caryā"
    subcategory: "dina"
    practitioner_level: "self-care"
    primary_indication: "Removes āma-coating; daily hygiene; agni-improvement"
    indications: ["daily hygiene", "āma management", "halitosis", "taste perception"]
    pradhana_karma:
      - {step: "Copper or stainless tongue scraper, 7 strokes from back to front"}
      - {step: "After danta-dhāvana, before water"}
    classical_source: "Caraka Sūtra 5"

