# Extended procedures — batch 2 (procedures 26-50+).
# Adds: more snehana variants, agnikarma, kṣārakarma, jalaukāvacaraṇa,
# more Kerala kriyā-bāhya, viśeṣa-vamana/virecana variants, kapha-vāta-pitta
# specific basti varieties.
#
# Sources: Suśruta Sūtra 11-13 (Kṣāra-agnikarma), Sūtra 13 (Jalaukā),
# Caraka Siddhi 1-12, Aṣṭāṅga Hṛdaya Sūtra 19-20, Sahasrayogam.
# All marked review_tier=llm-only; Vaidya validation pending.

procedures:

# ─── Surgical / kṣāra-agnikarma (3) ────────────────────────────────

  - name_iast: "Agnikarma"
    english: "Therapeutic cautery"
    hindi: "अग्निकर्म"
    category: "kriyā-bāhya"
    practitioner_level: "vaidya-only"
    primary_indication: "Chronic vāta-pradhāna pain (kaṭi-śūla, gṛdhrasī, sandhi-vāta), keloid management, plantar fasciitis"
    indications:
      - "kaṭi-śūla (chronic)"
      - "gṛdhrasī"
      - "kadara (corn / callus)"
      - "ārśas (hemorrhoid cautery)"
      - "plantar fasciitis"
    dosha_action: {vata: "śāmaka", pitta: "vardhaka (mild)", kapha: "śāmaka"}
    contraindications:
      - "raktapitta"
      - "pitta-prakṛti"
      - "summer (relative)"
      - "diabetic neuropathy"
      - "any bleeding diathesis"
    pradhana_karma:
      - {step: "Patient sat in safe asana"}
      - {step: "Pañcadhātu śalākā heated to dahanam-yogya tāpa"}
      - {step: "Brief precise application — bindu / lekhā / pratisaraṇa pattern"}
      - {step: "Total contact <2 sec per point"}
    paschat_karma:
      - {step: "Apply ghṛta + madhu mixture immediately to relieve dāha"}
      - {step: "Avoid water 24 hr"}
      - {step: "Daily wound dressing till healing"}
    common_oils: ["Ghṛta + madhu"]
    duration_notes: "Single session; may repeat after 7-10 day gap"
    adverse_events:
      - "Excessive burn (atiyoga)"
      - "Inadequate effect (ayoga)"
      - "Secondary infection"
    red_flags:
      - "Severe pain or signs of deeper tissue burn"
    classical_source: "Suśruta Sūtra 12 (Agnikarma-vidhi)"
    description: "Suśruta classifies agnikarma as superior to kṣārakarma; specific dahana-pakas defined for skin / muscle / vessel / bone."

  - name_iast: "Kṣārakarma"
    english: "Therapeutic alkali application"
    hindi: "क्षारकर्म"
    category: "kriyā-bāhya"
    practitioner_level: "vaidya-only"
    primary_indication: "Bhagandara (kṣāra-sūtra), kīlaka (corns), vraṇa, ārśas"
    indications: ["bhagandara", "ārśas", "kadara", "vraṇa (chronic)", "kīlaka"]
    dosha_action: {vata: "śāmaka", pitta: "vardhaka", kapha: "śāmaka"}
    contraindications:
      - "raktapitta"
      - "pregnancy"
      - "ulcerative skin lesions adjacent"
    pradhana_karma:
      - {step: "Apāmārga or Snuhī kṣāra prepared per Suśruta sūtra"}
      - {step: "For bhagandara: kṣāra-sūtra threaded through fistula tract"}
      - {step: "Replaced weekly until tract closes"}
    paschat_karma:
      - {step: "Local Triphalā-water dressing"}
      - {step: "Antibacterial coverage as needed"}
    common_dravyas: ["Apāmārga", "Snuhī (kṣāra)", "Yavakṣāra"]
    duration_notes: "Bhagandara: 6-12 weeks of weekly thread changes (modern evidence-based)"
    classical_source: "Suśruta Sūtra 11 (Kṣāra-vidhi); WHO traditional medicine module on kṣāra-sūtra"

  - name_iast: "Jalaukāvacaraṇa"
    english: "Leech therapy"
    hindi: "जलौकावचरण"
    category: "panchakarma"
    subcategory: "rakta-mokṣaṇa"
    practitioner_level: "vaidya-only"
    primary_indication: "Localized rakta-pitta-pradhāna disorders (vāta-rakta, sthāyī kuṣṭha, varicose ulcers)"
    indications: ["vāta-rakta", "varicose ulcers", "psoriatic plaques (specific)", "thrombophlebitis", "diabetic foot ulcer"]
    dosha_action: {vata: "sama", pitta: "śāmaka", kapha: "sama"}
    contraindications:
      - "Bleeding diatheses"
      - "Anticoagulant therapy"
      - "Pregnancy"
      - "Severe anemia"
      - "Sepsis"
    purva_karma:
      - {step: "Local snehana"}
      - {step: "Sterile leech (Hirudo medicinalis equivalent) prepared"}
    pradhana_karma:
      - {step: "Leech applied to lesion; allowed to attach"}
      - {step: "Feeds for 30-90 min until satiated"}
      - {step: "Detached with saindhava-haridrā if won't drop spontaneously"}
    paschat_karma:
      - {step: "Local pressure for hemostasis"}
      - {step: "Leech expressed of contents (for re-use after sterilization)"}
      - {step: "Patient observed for 30 min"}
    duration_notes: "Single session; repeat at 5-7 day intervals"
    adverse_events:
      - "Bleeding for hours (rare)"
      - "Aeromonas infection (rare; sterilization critical)"
    classical_source: "Suśruta Sūtra 13 (Jalaukā-prakṛti)"
    description: "Modern indication: FDA-approved for venous congestion in plastic surgery."

