  - name_iast: "Akṣitarpaṇa"
    english: "Eye oleation pool"
    hindi: "अक्षितर्पण"
    category: "kriyā-bāhya"
    practitioner_level: "vaidya-only"
    primary_indication: "Eye fatigue, mild refractive errors, dry eye, computer eye-strain"
    indications: ["asthenopia", "dry eye", "early presbyopia", "kṛcchra-darśana"]
    pradhana_karma:
      - {step: "Dough ring around closed eye"}
      - {step: "Warm Triphalā ghṛta pooled in"}
      - {step: "Patient blinks intermittently 15-20 min"}
    common_oils: ["Triphalā Ghṛta", "Mahā-Triphalā Ghṛta", "Drākṣādi Tarpaṇa-Ghṛta"]
    duration_notes: "Daily for 5-7 days"
    classical_source: "Aṣṭāṅga Hṛdaya Uttara 24"

  - name_iast: "Kavala-Gaṇḍūṣa"
    english: "Oil pulling / mouth-rinse"
    hindi: "कवल / गण्डूष"
    category: "caryā"
    subcategory: "dina"
    practitioner_level: "self-care"
    primary_indication: "Oral hygiene, mukha-pāka prevention, voice care"
    indications: ["danta-roga prevention", "mukha-pāka", "halitosis", "voice care"]
    pradhana_karma:
      - {step: "10-15 ml warm taila (Tila or medicated)"}
      - {step: "Swished 5-15 min (kavala) or held still (gaṇḍūṣa)"}
      - {step: "Spat out (not swallowed)"}
    common_oils: ["Tila Taila", "Irimedādi Taila", "Coconut oil"]
    duration_notes: "Daily morning"
    classical_source: "Caraka Sūtra 5; Aṣṭāṅga Hṛdaya Sūtra 22"
